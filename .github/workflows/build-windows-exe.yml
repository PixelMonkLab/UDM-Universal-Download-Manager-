# Builds UDM and publishes it.
#  - Publish a Release on GitHub (Releases > Draft a new release > tag like v1.0.0-beta > Publish):
#    this workflow then builds everything and attaches the download files + notes to that release.
#  - "Run workflow" (Actions tab): just builds; downloads appear at the bottom of the run page.
name: Build Windows app
on:
  workflow_dispatch:
  release:
    types: [published]

# never let two builds upload to the same release at once
concurrency:
  group: build-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows app (UDM.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build UDM.exe
        run: pyinstaller --noconfirm --clean UDM.spec
      - name: Check that the app starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\UDM\UDM.exe" -ArgumentList "--no-browser" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest "http://127.0.0.1:5757/api/ping" -UseBasicParsing -TimeoutSec 3; $r.Content; $ok = $true; break } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "UDM.exe did not start" }
      - name: Make UDM-Windows.zip
        shell: pwsh
        run: |
          Copy-Item "HOW TO USE - Windows.txt" "dist\UDM\"
          Compress-Archive -Path "dist\UDM" -DestinationPath "UDM-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: UDM-Windows
          path: UDM-Windows.zip

  packages:
    name: Mac/Linux package + add-ons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add-on packages
        run: python tools/package_addons.py
      - name: Make UDM-Mac-Linux.zip (keeps the start files double-clickable)
        run: |
          mkdir -p pkg/UDM
          cp -r app.py downloader.py ui.html manager.html mobile.html requirements.txt icon.ico \
                "Start UDM.command" start-mac-linux.sh fix-old-videos-mac.sh "HOW TO USE - Mac.txt" README.md PRIVACY.md \
                extension-chrome extension-firefox store assets pkg/UDM/
          chmod +x "pkg/UDM/Start UDM.command" pkg/UDM/start-mac-linux.sh pkg/UDM/fix-old-videos-mac.sh
          (cd pkg && zip -qr ../UDM-Mac-Linux.zip UDM)
      - uses: actions/upload-artifact@v4
        with:
          name: UDM-packages
          path: |
            UDM-Mac-Linux.zip
            dist-addons/*.zip

  release:
    name: Publish release
    if: github.event_name == 'release'
    needs: [windows, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach the downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          files=$(find out -name '*.zip' | sort)
          echo "$files"
          notes="RELEASE_NOTES.md"; [ -f "$notes" ] || echo "UDM ${TAG}" > "$notes"
          title="UDM ${TAG#v}"; title="${title/-beta/ Beta}"
          # upload one file at a time and retry, so a hiccup never leaves the release half-filled
          for f in $files; do
            for try in 1 2 3; do gh release upload "$TAG" "$f" --clobber && break; sleep 5; done
          done
          gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease=false --latest
          echo "Attached:"; gh release view "$TAG" --json assets --jq '.assets[].name'
